[project]
name = "hirekit-backend"
version = "0.1.0"
description = "FastAPI Backend for Hirekit Campus Placement and ATS Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis[hiredis]>=5.0.0",
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "aioboto3>=13.1.0",
    "google-genai>=0.1.1",
    "pillow>=10.4.0",
    "pypdf>=4.0.0",
    "tenacity>=9.0.0",
    "arq>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "factory-boy>=3.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirekit_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hirekit_prod
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirekit_worker
    restart: always
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/hirekit_prod
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "app.workers.worker.WorkerSettings"]

  postgres:
    image: postgres:16-alpine
    container_name: hirekit_postgres_prod
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hirekit_prod
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    # NOTE: no ports exposed — only reachable inside docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hirekit_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hirekit_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    # NOTE: no ports exposed — only reachable inside docker network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_prod_data:
  redis_prod_data:
